<!DOCTYPE html>
<html lang="ru">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Форма поиска</title>
        <!-- Подключаем Bootstrap CSS -->
        <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
        <!-- Подключаем общий файл стилей -->
        <link rel="stylesheet" href="/static/styles.css">
    </head>
    <body>
        <!-- Верхнее меню -->
        <nav class="navbar navbar-expand-lg navbar-dark">
            <a class="navbar-brand" href="{{ url_for('index') }}">HH Skills Parser</a>
            <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('index') }}">Главная</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('form') }}">Поиск</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('history') }}">История</a>
                    </li>
                </ul>
            </div>
        </nav>
        <div class="container">
            <h2 class="text-center">Форма для поиска вакансий</h2>
            <hr>
            <br>
            <h4>Параметры поиска</h4>
            <br>
            <form method="POST" action="{{ url_for('form') }}">
                <div class="form-group">
                    <input type="text" class="form-control" name="region_name" value="Москва" placeholder="Введите регион" required>
                </div>
                <div class="form-group">
                    <input type="text" class="form-control" name="name" value="Data Science" placeholder="Введите специализацию" required>
                </div>
                <div class="form-group">
                    <select name="schedule" class="form-control" required>
                        <option value="fullDay">Полный день</option>
                        <option value="shift">Сменный график</option>
                        <option value="remote">Удалённая работа</option>
                        <option value="flexible">Гибкий график</option>
                    </select>
                </div>

            <!-- Индикатор загрузки -->
            <div id="loading" style="display: none;">
                <div class="loader"></div>
                <p style="color: green;">Выполняется поиск...</p>
            </div>
            <input type="submit" class="btn btn-primary btn-block" value="Поиск">

            </form>
            <br>
            <p class="text-center mt-3">
                <a href="{{ url_for('index') }}">Вернуться на главную</a>
            </p>
        </div>
        <script>
            document.querySelector('form').onsubmit = function() {
                document.getElementById('loading').style.display = 'block';
            };
        </script>
        <!-- Нижний блок с контактами -->
        <footer>
            <p>Контакты: example@mail.com | Телефон: +7 123 456 78 90</p>
            <p>&copy; 2024 HH Parser. Все права защищены.</p>
        </footer>
        <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.2/dist/umd/popper.min.js"></script>
        <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    </body>    
</html>
