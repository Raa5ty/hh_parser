<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Результаты</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
    <div class="container text-center mt-4" style="max-width: 800px;">
        <h2 class="text-center">Параметры поиска</h2>
        <p>
            {{ region_name }} | {{ name }} | {{ schedule }}
        </p>
        <a class="btn btn-primary" href="{{ url_for('form') }}">Изменить параметры</a>
        <br><br>

        <!-- <h1 class="text-center mt-5">Результаты</h1> -->
        <p class="h5 text-center">Всего найдено вакансий: {{ total_vacancies }}</p>
        
        <table class="table mt-3">
            <thead>
                <tr>
                    <th>Навык</th>
                    <th>Востребованность</th>
                </tr>
            </thead>
            <tbody>
                {% for skill, percentage in skills.items() %}
                <tr>
                    <td>{{ skill }}</td>
                    <td>{{ percentage }}%</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
        
        <p>
            <a class="btn btn-primary" href="{{ url_for('index') }}">Вернуться на главную</a>
        </p>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.2/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>    
</html>
